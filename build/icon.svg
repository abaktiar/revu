<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- App tile depth: subtle top-to-bottom darkening, matches the app shell (#0f1115 -> panel) -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="0.55" stop-color="#141823"/>
      <stop offset="1" stop-color="#0e1016"/>
    </linearGradient>
    <!-- Faint top sheen for a modern, slightly raised feel (no glassmorphism) -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="212" y="256" width="600" height="512" rx="44"/>
    </clipPath>
  </defs>

  <!-- App tile (macOS/Windows-friendly rounded square, centered with margin) -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#sheen)"/>
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="183.25"
        fill="none" stroke="#2b3343" stroke-width="1.5"/>

  <!-- Code / diff surface -->
  <rect x="212" y="256" width="600" height="512" rx="44" fill="#1b2130"/>

  <g clip-path="url(#cardClip)">
    <!-- Gutter -->
    <rect x="212" y="256" width="118" height="512" fill="#151a25"/>
    <line x1="330" y1="256" x2="330" y2="768" stroke="#262d3c" stroke-width="2"/>

    <!-- Changed-line full-width tints (real diff-row backgrounds) -->
    <rect x="330" y="368" width="482" height="56" fill="#4ade80" opacity="0.13"/>
    <rect x="330" y="544" width="482" height="56" fill="#f87171" opacity="0.13"/>

    <!-- Code line bars (neutral) -->
    <rect x="362" y="294" width="248" height="32" rx="16" fill="#9aa3b5"/>
    <rect x="362" y="470" width="196" height="32" rx="16" fill="#9aa3b5"/>
    <rect x="362" y="634" width="270" height="32" rx="16" fill="#9aa3b5"/>
    <rect x="362" y="710" width="158" height="32" rx="16" fill="#7c8598"/>

    <!-- Added line (green) -->
    <rect x="362" y="380" width="306" height="32" rx="16" fill="#4ade80"/>
    <!-- Removed line (red) -->
    <rect x="362" y="556" width="226" height="32" rx="16" fill="#f87171"/>
  </g>

  <!-- Gutter markers: + added, - removed -->
  <g fill="none" stroke-linecap="round">
    <!-- plus -->
    <path d="M271 396 h-30 M256 381 v30" stroke="#4ade80" stroke-width="11"/>
    <!-- minus -->
    <path d="M271 572 h-30" stroke="#f87171" stroke-width="11"/>
  </g>

  <!-- Card edge to ground the surface -->
  <rect x="212.75" y="256.75" width="598.5" height="510.5" rx="43.25"
        fill="none" stroke="#2e3647" stroke-width="1.5"/>
</svg>
